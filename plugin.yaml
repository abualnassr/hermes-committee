manifest_version: 2
api_version: 1
name: hermes-committee
label: Hermes Committee
version: 0.3.0
description: >-
  Karpathy's LLM Council for Hermes: several AI models answer a question independently,
  rank each other's anonymous answers, and a chairman writes the final answer. Adds seat
  roles and instructions, a shared evidence pack, Stop-to-cancel, and a full Markdown + PDF
  committee report. Run it with /hermes-committee:convene <question>.
author: abualnassr
kind: standalone
license: MIT
homepage: https://github.com/abualnassr/hermes-committee
requires_hermes: ">=0.23.0"
tags: [llm-council, multi-model, deliberation, decision-support, reports]
capabilities:
  - llm.provider_override
  - llm.model_override
provides_tools:
  - committee_open
  - committee_advance
provides_hooks:
  - post_tool_call
  - on_session_end
config_schema:
  default_preset:
    type: str
    default: ""
    description: "Preset used when a run names none. Empty = the classic template on your active model."
  stage_timeout:
    type: int
    default: 360
    description: "Seconds each stage may take (max 400; Hermes cuts tool calls at 420)."
  max_tokens:
    type: int
    default: 8192
    description: "Max output tokens per model call."
  max_minutes:
    type: int
    default: 10
    description: "Default time limit for a whole committee run, in minutes (0 = no limit, max 60). Time for the chairman is reserved; the blind vote is skipped if time runs short."
  max_usd:
    type: float
    default: 2
    description: "Default budget for a whole committee run in USD (0 = no limit). Estimated from token counts and list prices; subscription seats count $0."
  billing:
    type: dict
    default: {}
    description: "Per-provider billing override, e.g. {openrouter: paid, my-provider: subscription}. Normally guessed from how Hermes signs in."
  presets:
    type: dict
    default: {}
    description: "Named committees: template, seats (provider/model, optional name/instructions), chairman. See README."
